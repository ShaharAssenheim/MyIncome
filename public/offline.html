<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f8fc" />
    <title>MyIncome · אין חיבור לרשת</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100svh; margin: 0; padding: 24px; place-items: center; background: #f5f8fc; color: #101b32; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 400px; padding: 36px; border: 1px solid #e3eaf3; border-radius: 18px; background: white; }
      .brand { display: block; margin-bottom: 32px; font-size: 24px; font-weight: 700; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 14px 0 28px; color: #61718b; font-size: 14px; line-height: 1.8; }
      a { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #00866b; color: white; font-size: 14px; text-decoration: none; }
      a:focus-visible { outline: 2px solid #00866b; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="brand" dir="ltr">MyIncome</span>
      <h1>אין חיבור לרשת</h1>
      <p>התחברו לאינטרנט כדי לטעון את נתוני החשבון.</p>
      <a href="/">ניסיון נוסף</a>
    </main>
  </body>
</html>
